server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/auth/ {
    proxy_pass http://hr-api:3001;
    proxy_set_header Host $http_host;
  }
  location /api/app/ {
    proxy_pass http://hr-api:3001;
    proxy_set_header Host $http_host;
  }

  location /api/hr/ {
    proxy_pass http://hr-api:3001;
    proxy_set_header Host $http_host;
  }

  # Webhooks d'n8n pel mateix origen (sense CORS). La IA pot trigar: timeout ampli.
  location /webhook/ {
    return 403;
  }

  # SPA: qualsevol ruta torna a index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
